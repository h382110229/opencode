name: sso-image

# Builds the OCI-SSO-enabled OpenCode image from the sso-patch branch and publishes it to
# ghcr.io/<owner>/opencode with a moving `latest` tag plus a pinned build version tag.

on:
  push:
    branches:
      - sso-patch
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sso-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode
  VERSION: 2.1.0-sso.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      # The Dockerfile copies the two musl binaries; everything else is upstream's own packaging.
      - name: Build linux x64 musl CLI
        run: ./packages/cli/script/build.ts --target=opencode-linux-x64-musl
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux arm64 musl CLI
        run: ./packages/cli/script/build.ts --target=opencode-linux-arm64-musl --skip-install
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f packages/cli/Dockerfile \
            --no-cache \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --push \
            packages/cli
